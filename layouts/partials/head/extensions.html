<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<script>
    (function () {
        try {
            var storedTheme = localStorage.getItem("portfolio-theme");
            var theme = storedTheme === "light" ? "light" : "tokyo";
            document.documentElement.dataset.portfolioTheme = theme;
            localStorage.setItem("colorscheme", theme === "tokyo" ? "dark" : "light");
        } catch (error) {
            document.documentElement.dataset.portfolioTheme = "tokyo";
        }
    })();
</script>
